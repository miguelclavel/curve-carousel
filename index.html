<style>
  :root { --page: #F9F9FB; --panel: #FFFFFF; --ink: #1D1D21; --muted: #67676C; --rule: #DADADD; --focus: #155EEF; }
  @media (prefers-color-scheme: dark) { :root { --page: #0F0F11; --panel: #17171A; --ink: #F5F5F7; --muted: #A3A3A8; --rule: #2E2E33; --focus: #9CC3FF; } }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--page); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; overflow: hidden; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; }
  main { height: 100%; }
  .stage { position: relative; height: 100%; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
  .card { position: absolute; left: 50%; top: 18%; width: min(440px, 72vw); margin-left: calc(min(440px, 72vw) / -2); transform-origin: 50% 50%; will-change: transform, opacity; border-radius: 18px; background: var(--panel); box-shadow: 0 20px 50px rgba(15,15,25,.18), 0 0 0 1px rgba(0,0,0,.05); overflow: hidden; color: inherit; text-decoration: none; display: block; }
  .card img { display: block; width: 100%; aspect-ratio: 16 / 10; object-fit: cover; pointer-events: none; }
  .card .t { padding: 14px 18px 16px; } .card b { display: block; font-size: 18px; letter-spacing: -0.01em; } .card small { color: var(--muted); font-size: 14px; }
  .nav { position: absolute; left: 0; right: 0; bottom: 64px; display: flex; justify-content: center; align-items: center; gap: 14px; }
  .nav button { width: 42px; height: 42px; border-radius: 999px; border: 1px solid var(--rule); background: var(--panel); color: var(--ink); font-size: 18px; cursor: pointer; }
  .nav span { font-size: 13px; color: var(--muted); min-width: 64px; text-align: center; }
  .hint { position: absolute; left: 0; right: 0; bottom: 8px; text-align: center; font-size: 12px; color: var(--muted); padding: 0 16px; line-height: 1.4; } .hint a { color: inherit; }
  body.embed .hint { display: none; }

<body>
<main>
<h1 class="sr-only">Case studies that ride a curve</h1>
<div class="stage" id="stage" role="region" aria-roledescription="carousel" aria-label="Case studies"></div>
<div class="nav"><button type="button" id="prev" aria-label="Previous case study">‹</button><span id="count" aria-live="polite"></span><button type="button" id="next" aria-label="Next case study">›</button></div>
</main>
<footer><p class="hint">Drag, swipe, scroll sideways or use the arrow keys. <a href="https://github.com/miguelclavel/curve-carousel">Code and prompt</a></p></footer>
<script>
  const CARDS = [
    ['Conversational Insurance Flow', 'A 30 question quote, rebuilt as a conversation', 'assets/auto-insurance-conversational-flow.jpg', 'https://miguelclavel.com/work/auto-insurance-conversational-flow'],
    ['Insurance Landing Page', 'Rebuilt around what people actually click', 'assets/insurance-landing-page.jpg', 'https://miguelclavel.com/work/insurance-landing-page'],
    ['Comparison System', 'One pattern from wide desktop to phone', 'assets/comparison-system.jpg', 'https://miguelclavel.com/work/comparison-system'],
    ['U.S. News Brand Guide', 'First the book, then the system that reads it', 'assets/us-news-brand-guide.jpg', 'https://miguelclavel.com/work/us-news-brand-guide'],
    ['360 Homepage Redesign', 'From content directory to product discovery', 'assets/360-homepage-redesign.jpg', 'https://miguelclavel.com/work/360-homepage-redesign'],
    ['Miami HEAT Homepage', 'A homepage built to move at game speed', 'assets/miami-heat-homepage.jpg', 'https://miguelclavel.com/work/miami-heat-homepage']
  ];
  const RADIUS = 1700;       // the circle the cards ride on; its centre is far below the screen
  const MIN_SCALE = 0.72;    // the floor, so far cards never vanish
  const SOLID = 1.5;         // no fade until a card is more than one and a half cards away
  const stage = document.getElementById('stage'), count = document.getElementById('count');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (new URLSearchParams(location.search).has('embed')) document.body.classList.add('embed');

  const els = CARDS.map(([t, s, img, url], i) => {
    const a = document.createElement('a');
    a.className = 'card'; a.href = url; a.draggable = false;
    a.innerHTML = `<img src="${img}" alt=""><div class="t"><b>${t}</b><small>${s}</small></div>`;
    a.addEventListener('click', e => { if (moved || i !== target) { e.preventDefault(); if (!moved) go(i); } });
    stage.appendChild(a);
    return a;
  });

  let target = 0, pos = 0, req = null, moved = false;
  function layout() {
    const w = els[0].offsetWidth, step = (w * 0.94) / RADIUS;      // the angle between neighbours
    els.forEach((el, i) => {
      const d = i - pos, ad = Math.abs(d), a = d * step;           // one number: distance from focus
      const x = Math.sin(a) * RADIUS, y = (1 - Math.cos(a)) * RADIUS;
      const scale = Math.max(MIN_SCALE, 1 - ad * 0.12);
      el.style.transform = `translate(${x}px, ${y}px) rotate(${a}rad) scale(${scale})`;
      el.style.opacity = String(ad <= SOLID ? 1 : Math.max(0, 1 - (ad - SOLID) * 0.7));
      el.style.zIndex = String(100 - Math.round(ad * 10));
      // Only the focused card takes clicks and keyboard focus; the rest are scenery until they're in front.
      const front = Math.round(pos) === i;
      el.tabIndex = front ? 0 : -1;
      el.setAttribute('aria-hidden', String(!front));
    });
    count.textContent = `${target + 1} of ${CARDS.length}`;
  }
  function animate() {
    pos += (target - pos) * (reduce ? 1 : 0.16);
    if (Math.abs(target - pos) < 0.001) pos = target;
    layout();
    req = pos === target ? null : requestAnimationFrame(animate);
  }
  function go(i) { target = Math.max(0, Math.min(CARDS.length - 1, i)); if (!req) req = requestAnimationFrame(animate); }
  document.getElementById('prev').onclick = () => go(target - 1);
  document.getElementById('next').onclick = () => go(target + 1);
  addEventListener('keydown', e => { if (e.key === 'ArrowRight') go(target + 1); if (e.key === 'ArrowLeft') go(target - 1); });

  // Drag or swipe: follow the finger, then settle on the nearest card.
  let startX = null, startPos = 0;
  stage.addEventListener('pointerdown', e => { startX = e.clientX; startPos = pos; moved = false; });
  addEventListener('pointermove', e => {
    if (startX == null) return;
    const dx = e.clientX - startX; if (Math.abs(dx) > 6) moved = true;
    pos = Math.max(-0.3, Math.min(CARDS.length - 0.7, startPos - dx / (els[0].offsetWidth * 0.94)));
    target = Math.round(Math.max(0, Math.min(CARDS.length - 1, pos))); layout();
  });
  addEventListener('pointerup', () => { if (startX == null) return; startX = null; go(Math.round(pos)); setTimeout(() => { moved = false; }, 0); });
  let wheelLock = 0;
  stage.addEventListener('wheel', e => { if (Math.abs(e.deltaX) < Math.abs(e.deltaY) || Date.now() < wheelLock) return; e.preventDefault(); wheelLock = Date.now() + 350; go(target + Math.sign(e.deltaX)); }, { passive: false });
  addEventListener('resize', layout);

  const start = parseInt(new URLSearchParams(location.search).get('at'), 10);
  if (start >= 0) { target = pos = Math.min(CARDS.length - 1, start); }
  layout();
</script>
